name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: MyFreeTelemetryViewer

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:win

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MyFreeTelemetryViewer/dist/*.exe
            MyFreeTelemetryViewer/dist/latest.yml
